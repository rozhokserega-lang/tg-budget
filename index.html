<!-- Адрес Edge Function `api`. Можно переопределить в браузере: index.html?api=https://... -->
<script>window.APP_API_URL = 'https://iqbbjkjzxtdqtuwhiadj.supabase.co/functions/v1/api';</script>

<div id="app" class="app">
  <header id="screen-header" class="screen-header" hidden></header>
  <main id="screen" class="screen" aria-live="polite"></main>
  <nav id="tabs" class="tabs" hidden></nav>
  <div id="loader" class="loader">
    <div class="loader__spinner"></div>
    <p class="loader__text">Загружаем бюджет…</p>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet__backdrop" data-sheet-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <div id="sheet-body" class="sheet__body"></div>
  </div>
</div>

<div id="dialog" class="dialog" hidden>
  <div class="dialog__backdrop" data-dialog-close></div>
  <div class="dialog__box" role="alertdialog" aria-modal="true">
    <p id="dialog-text" class="dialog__text"></p>
    <div class="dialog__actions">
      <button type="button" class="dialog__btn" data-dialog-close>Отмена</button>
      <button type="button" id="dialog-ok" class="dialog__btn dialog__btn--primary" data-dialog-ok>Удалить</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
