openapi: 3.1.0
info:
  title: TG Budget — Modules API
  version: 1.1.0
  description: |
    API v1 для модулей «Платежи», «Напоминания» и «Трекер задач».
    Авторизация — Telegram WebApp initData в заголовке `Authorization: tma <initData>`.
    Деньги — `numeric(14,2)`. Валюта — ISO 4217, по умолчанию из `/module-preferences` (`RUB`); конвертации нет. Время — ISO 8601 UTC, календарные даты — `YYYY-MM-DD`.
    Ошибки — `{error:{code,message,details}}`.
  contact:
    name: TG Budget backend
servers:
  - url: https://{projectRef}.supabase.co/functions/v1/api/v1
    variables:
      projectRef:
        default: iqbbjkjzxtdqtuwhiadj
security:
  - telegramInitData: []
tags:
  - name: service
  - name: payments
  - name: payment-occurrences
  - name: reminders
  - name: reminder-occurrences
  - name: task-lists
  - name: tasks
  - name: preferences
paths:
  /health:
    get:
      tags: [service]
      summary: Проверка доступности API
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: { type: boolean, const: true }
                  version: { type: string, const: '1.1.0' }
                  time: { type: string, format: date-time }

  /payment-templates:
    get:
      tags: [payments]
      summary: Все шаблоны платежей семьи
      description: Включает приостановленные и будущие шаблоны без начислений; удалённые исключены. nextOccurrence в списке null; GET /payments/{id} возвращает ближайшее начисление.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница шаблонов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentTemplatePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /payments:
    get:
      tags: [payments]
      summary: Календарь начислений
      description: Возвращает начисления за диапазон, включая просроченные вне диапазона.
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentOccurrenceStatus' }
        - name: templateId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница начислений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOccurrencePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [payments]
      summary: Создать платёж
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreateRequest' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /payments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [payments]
      summary: Шаблон платежа
      responses:
        '200':
          description: Платёж
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [payments]
      summary: Изменить шаблон
      description: Изменения применяются только к будущим начислениям.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentUpdateRequest' }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [payments]
      summary: Удалить платёж
      responses:
        '200':
          description: Удалён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [payments]
      summary: Приостановить платёж
      responses:
        '200':
          description: Приостановлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [payments]
      summary: Возобновить платёж
      responses:
        '200':
          description: Возобновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payment-occurrences/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [payment-occurrences]
      summary: Начисление
      responses:
        '200':
          description: Начисление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOccurrence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payment-occurrences/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
    post:
      tags: [payment-occurrences]
      summary: Подтвердить оплату
      description: |
        Атомарно создаёт расход, связывает его с начислением и отменяет уведомления.
        Повтор с тем же ключом возвращает сохранённый ответ; второй расход не создаётся.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentConfirmRequest' }
      responses:
        '200':
          description: Оплачено (в т.ч. повтор)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reminders:
    get:
      tags: [reminders]
      summary: Календарь напоминаний
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReminderOccurrenceStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/Priority' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница событий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderOccurrencePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [reminders]
      summary: Создать напоминание
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderCreateRequest' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reminders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [reminders]
      summary: Напоминание
      responses:
        '200':
          description: Напоминание
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [reminders]
      summary: Изменить напоминание
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderUpdateRequest' }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [reminders]
      summary: Удалить напоминание
      responses:
        '200':
          description: Удалено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reminders/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [reminders]
      summary: Приостановить
      responses:
        '200':
          description: Приостановлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reminders/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [reminders]
      summary: Возобновить
      responses:
        '200':
          description: Возобновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reminder-occurrences/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [reminder-occurrences]
      summary: Событие напоминания
      responses:
        '200':
          description: Событие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderOccurrence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reminder-occurrences/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
    post:
      tags: [reminder-occurrences]
      summary: Выполнить событие
      description: Для разового напоминания удаляет напоминание и событие.
      responses:
        '200':
          description: Выполнено
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReminderOccurrence'
                  - $ref: '#/components/schemas/ReminderCompletedDeletion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /task-lists:
    get:
      tags: [task-lists]
      summary: Списки задач
      responses:
        '200':
          description: Списки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [task-lists]
      summary: Создать список
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskListCreateRequest' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /task-lists/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [task-lists]
      summary: Переименовать список
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskListUpdateRequest' }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [task-lists]
      summary: Удалить список без потери задач
      responses:
        '200':
          description: Удалён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListDeleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks:
    get:
      tags: [tasks]
      summary: Задачи
      parameters:
        - name: listId
          in: query
          description: uuid или `none` для задач без списка
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/TaskSortMode' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/Priority' }
        - name: dueFrom
          in: query
          schema: { type: string, format: date }
        - name: dueTo
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница задач
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [tasks]
      summary: Создать задачу
      description: С recurrenceRule создаётся серия и первый экземпляр.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tasks/completed:
    get:
      tags: [tasks]
      summary: Выполненные задачи
      parameters:
        - name: listId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница выполненных
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/reorder:
    patch:
      tags: [tasks]
      summary: Ручной порядок задач
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskReorderRequest' }
      responses:
        '200':
          description: Новый порядок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskReorderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tasks]
      summary: Задача
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      summary: Изменить задачу
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [instance, series], default: instance }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: Обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [tasks]
      summary: Удалить задачу
      description: Удаление экземпляра серии пропускает только это событие и не останавливает серию.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [instance, series], default: instance }
      responses:
        '200':
          description: Удалена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
    post:
      tags: [tasks]
      summary: Выполнить задачу
      responses:
        '200':
          description: Выполнена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCompleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
    post:
      tags: [tasks]
      summary: Восстановить задачу
      responses:
        '200':
          description: Восстановлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskRestoreResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionExpired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /module-preferences:
    get:
      tags: [preferences]
      summary: Настройки модулей
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulePreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [preferences]
      summary: Изменить настройки
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModulePreferencesUpdateRequest' }
      responses:
        '200':
          description: Обновлены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulePreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    telegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: 'Значение: `tma <initData>`.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FromDate:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
      description: Не больше 370 дней от `from`.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: { code: UNAUTHORIZED, message: 'Invalid Telegram init data', details: {} }
    SubscriptionExpired:
      description: Истёк доступ семьи
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: { code: SUBSCRIPTION_EXPIRED, message: 'Subscription expired', details: {} }
    NotFound:
      description: Не найдено или чужой объект
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: { code: NOT_FOUND, message: 'Not found', details: {} }
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: { code: CONFLICT, message: 'Already paid', details: { reason: ALREADY_PAID } }
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: { code: VALIDATION_ERROR, message: 'Invalid payment amount', details: { field: plannedAmount } }
    InternalError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: { code: INTERNAL_ERROR, message: 'Internal error', details: {} }

  schemas:
    Priority:
      type: string
      enum: [normal, important]

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217. По умолчанию берётся из `/module-preferences`.
      examples: [RUB]

    PaymentOccurrenceStatus:
      type: string
      enum: [pending, overdue, paid]

    ReminderOccurrenceStatus:
      type: string
      enum: [pending, overdue, completed]

    TaskStatus:
      type: string
      enum: [active, completed]

    TaskSortMode:
      type: string
      enum: [due, priority, created, manual]

    RecurrenceRule:
      type: object
      additionalProperties: false
      required: [frequency, interval]
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1, maximum: 365, default: 1 }
        weekdays:
          type: [array, 'null']
          description: 'Только для weekly: 1 = понедельник … 7 = воскресенье.'
          items: { type: integer, minimum: 1, maximum: 7 }
          maxItems: 7
          uniqueItems: true
        timezone: { type: string, description: IANA, приводится к таймзоне сущности }

    NotificationRule:
      type: object
      additionalProperties: false
      required: [offsetMinutes]
      properties:
        offsetMinutes: { type: integer, minimum: 0, maximum: 43200 }
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Локальное время для платёжных начислений; по умолчанию 10:00.

    OverdueNotificationRule:
      type: object
      additionalProperties: false
      required: [everyDays, maxCount]
      properties:
        everyDays: { type: integer, minimum: 1, maximum: 30 }
        maxCount: { type: integer, minimum: 1, maximum: 30 }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - SUBSCRIPTION_EXPIRED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - VALIDATION_ERROR
                - RATE_LIMITED
                - INTERNAL_ERROR
                - TELEGRAM_ERROR
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
        id: { type: string, format: uuid }

    OccurrenceSummary:
      type: object
      required: [id, dueDate, status, plannedAmount]
      properties:
        id: { type: string, format: uuid }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/PaymentOccurrenceStatus' }
        plannedAmount: { type: number, multipleOf: 0.01 }

    PaymentSummary:
      type: object
      required: [id, title, currency, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        categoryId: { type: [string, 'null'], format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [active, paused] }

    Payment:
      type: object
      required:
        [id, title, plannedAmount, currency, recurrenceRule, firstDueDate, timezone,
         notificationRules, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        plannedAmount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        currency: { $ref: '#/components/schemas/Currency' }
        categoryId: { type: [string, 'null'], format: uuid }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        firstDueDate: { type: string, format: date }
        timezone: { type: string }
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        overdueNotificationRule:
          oneOf:
            - $ref: '#/components/schemas/OverdueNotificationRule'
            - type: 'null'
        status: { type: string, enum: [active, paused] }
        nextOccurrence:
          oneOf:
            - $ref: '#/components/schemas/OccurrenceSummary'
            - type: 'null'
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    PaymentOccurrence:
      type: object
      required:
        [id, templateId, dueDate, plannedAmount, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        payment: { $ref: '#/components/schemas/PaymentSummary' }
        dueDate: { type: string, format: date }
        plannedAmount: { type: number, multipleOf: 0.01 }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/PaymentOccurrenceStatus' }
        paidAt: { type: [string, 'null'], format: date-time }
        actualAmount: { type: [number, 'null'], multipleOf: 0.01 }
        actualDate: { type: [string, 'null'], format: date }
        actualCategoryId: { type: [string, 'null'], format: uuid }
        expenseId: { type: [string, 'null'], format: uuid }
        confirmedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PaymentTemplatePage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    PaymentOccurrencePage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PaymentOccurrence' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    PaymentCreateRequest:
      type: object
      additionalProperties: false
      required: [title, plannedAmount, firstDueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        plannedAmount: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01 }
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: По умолчанию — `currency` из `/module-preferences`.
        categoryId: { type: [string, 'null'], format: uuid }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        firstDueDate: { type: string, format: date }
        timezone: { type: string }
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        overdueNotificationRule:
          oneOf:
            - $ref: '#/components/schemas/OverdueNotificationRule'
            - type: 'null'
        status: { type: string, enum: [active, paused], default: active }

    PaymentUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        plannedAmount: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01 }
        currency: { $ref: '#/components/schemas/Currency' }
        categoryId: { type: [string, 'null'], format: uuid }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        firstDueDate: { type: string, format: date }
        timezone: { type: string }
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        overdueNotificationRule:
          oneOf:
            - $ref: '#/components/schemas/OverdueNotificationRule'
            - type: 'null'
        status: { type: string, enum: [active, paused] }
        version: { type: integer, minimum: 1 }

    PaymentConfirmRequest:
      type: object
      additionalProperties: false
      required: [actualAmount, actualDate]
      properties:
        actualAmount: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01 }
        actualDate: { type: string, format: date }
        categoryId: { type: string, format: uuid }

    PaymentConfirmResponse:
      type: object
      required: [occurrenceId, status, expenseId, actualAmount, actualDate, categoryId]
      properties:
        occurrenceId: { type: string, format: uuid }
        status: { type: string, const: paid }
        expenseId: { type: string, format: uuid }
        actualAmount: { type: number, multipleOf: 0.01 }
        actualDate: { type: string, format: date }
        categoryId: { type: string, format: uuid }
        confirmedBy: { type: string, format: uuid }
        paidAt: { type: string, format: date-time }

    Reminder:
      type: object
      required:
        [id, title, startsAt, timezone, priority, recurrenceRule, notificationRules,
         status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        timezone: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        status: { type: string, enum: [active, paused] }
        nextOccurrence:
          oneOf:
            - type: object
              required: [id, scheduledAt, status]
              properties:
                id: { type: string, format: uuid }
                scheduledAt: { type: string, format: date-time }
                status: { $ref: '#/components/schemas/ReminderOccurrenceStatus' }
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    ReminderOccurrence:
      type: object
      required: [id, reminderId, scheduledAt, localDate, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        reminderId: { type: string, format: uuid }
        reminder:
          type: object
          required: [id, title, priority, status]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            priority: { $ref: '#/components/schemas/Priority' }
            status: { type: string, enum: [active, paused] }
        scheduledAt: { type: string, format: date-time }
        localDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/ReminderOccurrenceStatus' }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    ReminderOccurrencePage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReminderOccurrence' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    ReminderCreateRequest:
      type: object
      additionalProperties: false
      required: [title, startsAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        timezone: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        status: { type: string, enum: [active, paused], default: active }

    ReminderUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        timezone: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        status: { type: string, enum: [active, paused] }
        version: { type: integer, minimum: 1 }

    ReminderCompletedDeletion:
      type: object
      required: [deleted, occurrenceId, reminderId]
      properties:
        deleted: { type: boolean, const: true }
        occurrenceId: { type: string, format: uuid }
        reminderId: { type: string, format: uuid }

    TaskList:
      type: object
      required: [id, title, taskCount, activeCount, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        taskCount: { type: integer, minimum: 0 }
        activeCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    TaskListCollection:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaskList' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    TaskListCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }

    TaskListUpdateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        version: { type: integer, minimum: 1 }

    TaskListDeleteResult:
      type: object
      required: [deleted, unassignedTasks]
      properties:
        deleted: { type: boolean, const: true }
        unassignedTasks: { type: integer, minimum: 0 }

    Task:
      type: object
      required:
        [id, ownerId, listId, seriesId, title, dueAt, timezone, priority, recurrenceRule,
         notificationRules, status, sortOrder, completedAt, deleteAfter, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        listId: { type: [string, 'null'], format: uuid }
        seriesId: { type: [string, 'null'], format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        dueAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        sortOrder: { type: integer }
        completedAt: { type: [string, 'null'], format: date-time }
        deleteAfter: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    TaskPage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    TaskCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        listId: { type: [string, 'null'], format: uuid }
        dueAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        sortOrder: { type: integer }

    TaskUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        listId: { type: [string, 'null'], format: uuid }
        dueAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        recurrenceRule:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRule'
            - type: 'null'
        notificationRules:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NotificationRule' }
        sortOrder: { type: integer }
        version: { type: integer, minimum: 1 }

    TaskReorderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        listId: { type: [string, 'null'], format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, sortOrder]
            properties:
              id: { type: string, format: uuid }
              sortOrder: { type: integer }
              version: { type: integer, minimum: 1 }

    TaskReorderResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    TaskCompleteResponse:
      type: object
      required: [task, nextTask]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        nextTask:
          oneOf:
            - $ref: '#/components/schemas/Task'
            - type: 'null'

    TaskRestoreResponse:
      type: object
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/Task' }

    ModulePreferences:
      type: object
      required: [selectedTaskListId, taskSortMode, currency, updatedAt]
      properties:
        selectedTaskListId: { type: [string, 'null'], format: uuid }
        taskSortMode: { $ref: '#/components/schemas/TaskSortMode' }
        currency: { $ref: '#/components/schemas/Currency' }
        updatedAt: { type: [string, 'null'], format: date-time }

    ModulePreferencesUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        selectedTaskListId: { type: [string, 'null'], format: uuid }
        taskSortMode: { $ref: '#/components/schemas/TaskSortMode' }
        currency: { $ref: '#/components/schemas/Currency' }
